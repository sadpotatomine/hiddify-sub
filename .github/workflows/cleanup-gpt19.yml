name: Remove Failed GPT 19

on:
  push:
    paths:
      - ".github/workflows/cleanup-gpt19.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet pyyaml
      - name: Remove GPT 19 from active subscriptions
        run: |
          python - <<'PY'
          import urllib.parse
          import yaml
          target = '10-17 美国 gpt 19 VMESS'
          with open('clash.yaml', encoding='utf-8') as f:
              data = yaml.safe_load(f)
          before = len(data.get('proxies', []))
          data['proxies'] = [p for p in data.get('proxies', []) if p.get('name') != target]
          assert before - len(data['proxies']) == 1
          for group in data.get('proxy-groups', []):
              if isinstance(group.get('proxies'), list):
                  group['proxies'] = [x for x in group['proxies'] if x != target]
          with open('clash.yaml', 'w', encoding='utf-8') as f:
              yaml.safe_dump(data, f, allow_unicode=True, sort_keys=False, width=1000)
          with open('nodes-fuzhou-20260929.txt', encoding='utf-8') as f:
              lines = f.read().splitlines()
          kept = []
          removed = 0
          for line in lines:
              frag = urllib.parse.unquote(line.rsplit('#', 1)[-1]) if '#' in line else ''
              if frag == target:
                  removed += 1
              else:
                  kept.append(line)
          assert removed == 1
          with open('nodes-fuzhou-20260929.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(kept) + '\n')
          readme = [
              '# hiddify-sub', '', '## 汇总订阅', '',
              '- [福州节点汇总订阅 (Hiddify / 通用)](nodes-fuzhou-20260929.txt)',
              '- [Clash / Clash Meta 专属订阅](clash.yaml)', '',
              '当前共 16 条，继续排除香港。', '',
              '命名规则：新加入节点统一使用“日期 国家 gpt/反重力 序号 协议”。其中 gpt 表示由 ChatGPT 流程筛选加入，反重力表示由反重力流程加入。', '',
              'GPT 实测流程已启用：候选在 GitHub Actions 的 Ubuntu Runner 中使用 Mihomo 建立真实代理隧道；每轮重新启动代理核心，依次完成真实 HTTPS 连通检查与 4 MiB 完整下载，下载串行限速约 256 KiB/s。每条至少测试 5 轮，任一轮失败则不作为稳定节点保留。', '',
              '本轮曾筛出 gpt 19–28。前两批独立 5 轮测试中，只有 `10-17 美国 gpt 19 VMESS` 两批均为 5/5；但后续再次复测时，gpt 19 第 1 轮真实 HTTPS 检查失败（该轮 4 MiB 下载仍完成），最终仅 4/5，因此也按严格规则移除。当前活动订阅中不保留本轮 GPT 候选。', '',
              '工作流已进一步加入：初始 5 轮全部通过后，间隔至少 10 分钟重新连接，再进行 5 分钟、每 30 秒一次的 HTTPS 健康检查，最后再下载完整 4 MiB。任一步失败即淘汰。', '',
              '旧的反重力/Codex 节点未在本轮重新测试。', '',
              'nodes.txt 保留早期合集。', ''
          ]
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(readme))
          PY
      - name: Validate no GPT candidates remain
        run: |
          python - <<'PY'
          import yaml
          with open('clash.yaml', encoding='utf-8') as f:
              data = yaml.safe_load(f)
          assert not [p for p in data.get('proxies', []) if ' gpt ' in p.get('name', '')]
          PY
      - name: Commit cleanup and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-gpt19.yml
          git add README.md clash.yaml nodes-fuzhou-20260929.txt
          git commit -m "Remove GPT 19 after failed follow-up real test"
          git push origin HEAD:main
