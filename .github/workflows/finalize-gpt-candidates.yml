name: Finalize GPT Candidate Results

on:
  workflow_run:
    workflows: ["GPT Node Real Test"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet pyyaml
      - name: Promote only long-stability passes and remove all candidates
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, copy, json, os, re, urllib.parse, urllib.request, yaml

          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}/jobs?per_page=100",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as r:
              jobs = json.load(r)['jobs']

          passed = []
          for j in jobs:
              m = re.fullmatch(r'test \((.+)\)', j.get('name',''))
              if m and j.get('conclusion') == 'success':
                  passed.append(m.group(1))
          passed = set(passed)
          print('Long-stability passes:', len(passed))

          with open('.github/gpt-candidates-20261017.yaml', encoding='utf-8') as f:
              candidate_data = yaml.safe_load(f)
          candidates = candidate_data.get('proxies', [])
          candidate_names = {p['name'] for p in candidates}

          with open('clash.yaml', encoding='utf-8') as f:
              clash = yaml.safe_load(f)

          base_proxies = [p for p in clash.get('proxies', []) if p.get('name') not in candidate_names]
          nums = []
          for p in base_proxies:
              m = re.search(r'\bgpt\s+(\d+)\b', p.get('name',''), re.I)
              if m: nums.append(int(m.group(1)))
          next_num = max([28] + nums) + 1

          promoted = []
          subscriptions = []
          def proto_label(t):
              return {'ss':'SHADOWSOCKS','vless':'VLESS','vmess':'VMESS','hysteria2':'HYSTERIA2','trojan':'TROJAN'}.get(t, t.upper())
          def quote_name(s):
              return urllib.parse.quote(s, safe='')
          def to_uri(p):
              t=p['type']; name=p['name']; host=str(p['server']); port=str(p['port'])
              if t == 'ss':
                  userpass=f"{p['cipher']}:{p['password']}".encode()
                  auth=base64.urlsafe_b64encode(userpass).decode().rstrip('=')
                  return f"ss://{auth}@{host}:{port}#{quote_name(name)}"
              if t == 'vless':
                  q={}
                  if p.get('reality-opts'):
                      q['security']='reality'
                      ro=p['reality-opts']
                      if ro.get('public-key'): q['pbk']=ro['public-key']
                      if ro.get('short-id') is not None: q['sid']=str(ro.get('short-id',''))
                  elif p.get('tls'):
                      q['security']='tls'
                  if p.get('network'): q['type']=p['network']
                  if p.get('servername'): q['sni']=p['servername']
                  if p.get('client-fingerprint'): q['fp']=p['client-fingerprint']
                  if p.get('flow'): q['flow']=p['flow']
                  return f"vless://{p['uuid']}@{host}:{port}?{urllib.parse.urlencode(q)}#{quote_name(name)}"
              raise ValueError(f'Unsupported promoted type: {t}')

          for src in candidates:
              if src['name'] not in passed:
                  continue
              p=copy.deepcopy(src)
              parts=src['name'].split()
              country=parts[1]
              p['name']=f"10-17 {country} gpt {next_num} {proto_label(p['type'])}"
              next_num += 1
              promoted.append(p)
              subscriptions.append(to_uri(p))

          clash['proxies'] = base_proxies + promoted
          final_names = [p['name'] for p in promoted]
          for group in clash.get('proxy-groups', []):
              if isinstance(group.get('proxies'), list):
                  group['proxies'] = [n for n in group['proxies'] if n not in candidate_names]
                  if group.get('name') in ('🚀 节点选择','⚡ 自动选择'):
                      group['proxies'].extend(final_names)
          with open('clash.yaml','w',encoding='utf-8') as f:
              yaml.safe_dump(clash,f,allow_unicode=True,sort_keys=False,width=1000)

          with open('nodes-fuzhou-20260929.txt', encoding='utf-8') as f:
              lines=[x for x in f.read().splitlines() if x.strip()]
          lines.extend(subscriptions)
          with open('nodes-fuzhou-20260929.txt','w',encoding='utf-8') as f:
              f.write('\n'.join(lines)+'\n')

          with open('README.md', encoding='utf-8') as f:
              readme=f.read()
          total=len(clash['proxies'])
          readme=re.sub(r'当前共 \d+ 条', f'当前共 {total} 条', readme, count=1)
          marker='## GPT 本轮实测结果（10-17）'
          if marker in readme:
              readme=readme.split(marker)[0].rstrip()+'\n'
          result_names='、'.join(f'`{n}`' for n in final_names) if final_names else '无'
          readme += f"\n{marker}\n\n候选 16 条；严格长稳定性测试最终通过 {len(promoted)} 条，失败 {16-len(promoted)} 条。正式加入：{result_names}。未通过节点已从活动 Clash 配置清除。\n"
          with open('README.md','w',encoding='utf-8') as f:
              f.write(readme)

          print('Promoted:', *final_names, sep='\n- ')
          PY
      - name: Validate final configs
        run: |
          python - <<'PY'
          import yaml
          with open('clash.yaml',encoding='utf-8') as f: d=yaml.safe_load(f)
          assert not [p for p in d.get('proxies',[]) if ' gpt 候选' in p.get('name','')]
          names={p['name'] for p in d.get('proxies',[])}
          for g in d.get('proxy-groups',[]):
              for n in g.get('proxies',[]):
                  if n not in names and n not in {'⚡ 自动选择','🚀 节点选择','DIRECT'}:
                      raise SystemExit(f'Unknown group member: {n}')
          print('Final proxy count:', len(d.get('proxies',[])))
          PY
      - name: Commit final result and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-gpt-candidates.yml .github/gpt-candidates-20261017.yaml
          git add README.md clash.yaml nodes-fuzhou-20260929.txt
          git commit -m "Finalize strict GPT node round from real stability tests"
          git push origin HEAD:main
