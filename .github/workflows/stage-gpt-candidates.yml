name: Stage GPT Candidates
on:
  push:
    paths:
      - ".github/workflows/stage-gpt-candidates.yml"
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet pyyaml
      - name: Stage candidates outside active groups
        run: |
          python - <<'PY'
          import yaml
          with open('clash.yaml', encoding='utf-8') as f:
              clash = yaml.safe_load(f)
          with open('.github/gpt-candidates-20261017.yaml', encoding='utf-8') as f:
              cand = yaml.safe_load(f)
          existing={(p.get('server'),p.get('port'),p.get('type')) for p in clash.get('proxies',[])}
          added=[]
          for p in cand.get('proxies',[]):
              key=(p.get('server'),p.get('port'),p.get('type'))
              if key not in existing:
                  clash.setdefault('proxies',[]).append(p)
                  existing.add(key)
                  added.append(p.get('name'))
          if len(added) != 16:
              raise SystemExit(f'Expected 16 new candidates, staged {len(added)}')
          with open('clash.yaml','w',encoding='utf-8') as f:
              yaml.safe_dump(clash,f,allow_unicode=True,sort_keys=False,width=1000)
          print('Staged candidates:', len(added))
          PY
      - name: Commit staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage-gpt-candidates.yml
          git add clash.yaml
          git commit -m "Stage 16 GPT candidates outside active groups for strict tests"
          git push origin HEAD:main
